kind: 'Added'
body: 'added the Kubernetes Job executor for the webhook server (`server.executor: kubernetes`): the server keeps the cheap gates (draft, review-once, trivial detection) and hands each review that needs the AI to its own Job, created from an operator-owned `batch/v1` template (`server.kubernetes.job_template`) and deleted after it finishes. Jobs are created suspended and released oldest-first while fewer than `server.kubernetes.max_concurrent_jobs` (default 3) run, with the server replicas taking turns under a Kubernetes Lease so the cap holds across all of them; a waiting pull request gets a "queued" notice, the queue survives server restarts, and a review pod that dies without posting gets its failure reported on the pull request, matched to the Job by the name stamped on its notices (`review --job-name`)'
