kind: 'Added'
body: 'added the Kubernetes Job executor for the webhook server (`server.executor: kubernetes`): the server keeps the cheap gates (draft, review-once, trivial detection) and hands each review that needs the AI to its own Job, created from an operator-owned `batch/v1` template (`server.kubernetes.job_template`, rejected at startup if its `parallelism` or `completions` would run a review in more than one pod) and deleted after it finishes. Jobs are created suspended and released oldest-first while fewer than `server.kubernetes.max_concurrent_jobs` (default 3) run, with the server replicas taking turns under a Kubernetes Lease so the cap holds across all of them, and a Job whose start the API server refuses hands its slot to the next one in line instead of holding the queue; a waiting pull request gets a "queued" notice, the queue survives server restarts, and a review pod that dies without posting gets its failure reported on the pull request, matched to the Job by the name stamped on its notices (`review --job-name`). The review pod authenticates as the server did: with the GitHub App installation token when the delivery came through the App, ahead of any configured PAT'
