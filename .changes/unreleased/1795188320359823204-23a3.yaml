kind: 'Security'
body: 'stopped reading a configuration file from the working directory (`.code-guru.yaml`, `.config/code-guru.yaml` or `configs/code-guru.yaml`) unless `--config` names it: code-guru often runs inside a checkout of the code it reviews, where that file is the pull request author''s to write, and it could set `ai.claude.binary_path` to make code-guru start a program from the checkout, point a `token` at any variable or file, and switch on votes and merges. The configuration is now read from `--config`, else `~/.code-guru.yaml` or `~/.config/code-guru.yaml`, else the `CODE_GURU_*` variables, and a warning names a working-directory file that was skipped; pass `--config <file>` to keep using one'
breaking: true
time: '2026-11-20T15:25:20.359760846Z'
