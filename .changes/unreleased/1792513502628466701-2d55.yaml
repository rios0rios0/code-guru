kind: 'Security'
body: 'handed the agentic reviewer''s model credential to the Claude Code CLI over an inherited socket (`CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR` / `CLAUDE_CODE_API_KEY_FILE_DESCRIPTOR`) instead of its environment, so neither the CLI''s `/proc/<pid>/environ` nor any command the reviewing agent runs can read an OAuth token or API key, even in the container image, where Claude Code''s subprocess environment scrub cannot run; made a review holding `ANTHROPIC_AUTH_TOKEN`, which the CLI reads only from its environment, refuse to start where the scrub cannot run unless `ai.claude.agentic.subprocess_env_scrub` is explicitly `false`; and requested the scrub only where both bubblewrap and socat are installed, since without socat every command the agent ran failed'
time: '2026-10-20T16:25:02.62838525Z'
