kind: 'Added'
body: 'added the agentic review mode (`ai.claude.mode: agentic`): the pull request is checked out with git and Claude Code reviews the whole repository as a read-only agent in six passes (guidelines, bugs, git history, code comments, security, design), with every finding scored and the ones below `ai.claude.agentic.min_confidence` (default 80) dropped and listed, and the verdict relaxed to what the surviving findings justify so a dropped error never casts a changes-requested vote; findings post as one thread each headed `**<dimension> (confidence <n>)**`, and the completion notice carries a findings index, what each dimension checked and the dropped list. The run is sandboxed: the checkout''s own `.claude` settings, hooks, MCP servers and memory files never load, Bash is limited to read-only git commands, reads outside the checkout are blocked, installed skills and commands keep only an allowlist of harmless frontmatter keys (or are not installed when their frontmatter cannot be read with certainty), the provider token never reaches the agent and secrets are redacted from everything posted. On GitHub the head is fetched from `refs/pull/<id>/head`, so a pull request from a fork is reviewed against its own code; on Azure DevOps, which publishes no such ref, a pull request from a fork is refused before anything is cloned; and a checkout that changes none of the files the provider lists is refused rather than reviewed — see `docs/AGENTIC_REVIEWS.md`'
