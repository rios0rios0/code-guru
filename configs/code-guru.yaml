providers:
  - type: 'github'
    token: '${GITHUB_TOKEN}'
    organizations:
      - 'rios0rios0'
  # - type: 'azuredevops'
  #   token: '${ADO_PAT}'
  #   organizations:
  #     - 'ExampleOrg'

ai:
  backend: 'claude'
  openai:
    api_key: '${OPENAI_API_KEY}'
    model: 'gpt-4o'
  claude:
    binary_path: 'claude'
    model: 'sonnet'
    # 'agentic' checks the PR out and runs Claude Code as a read-only reviewing
    # agent over the repository (needs `git`); see docs/AGENTIC_REVIEWS.md.
    # mode: 'agentic'
    # agentic:
    #   # environment variables are expanded, as in rules.path
    #   config_path: '${HOME}/.claude'
    #   timeout: '30m'
    #   min_confidence: 80
  # Load the reviewed repository's own AGENTS.md (CLAUDE.md when there
  # is none) as project-specific review context (default: true; set false to opt out).
  project_guidelines: true
  # Fetch the PR's description and commit count as intent context for
  # the AI (default: true; set false to opt out).
  pr_metadata: true

rules:
  path: '${HOME}/Development/github.com/rios0rios0/guide/.ai/claude/rules'
  categories: []

